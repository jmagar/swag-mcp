[project]
name = "swag-mcp"
version = "1.1.5"
description = "SWAG reverse proxy configuration generator MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "SWAG MCP Team" }
]
dependencies = [
    "fastmcp>=3.2.4,<4.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "aiofiles>=24.1.0,<25.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "regex>=2024.5.15,<2027.0.0",
    "docker>=7.1.0,<8.0.0",
    "asyncssh>=2.14.0,<3.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swag_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
    "ruff>=0.8.0,<1.0.0",
    "ty>=0.0.24,<1.0.0",
    "bandit>=1.7.0,<2.0.0",
    "pip-audit>=2.0.0,<3.0.0",
    "hypothesis>=6.0.0,<7.0.0", # Property-based testing
    "pytest-benchmark>=4.0.0,<6.0.0", # Performance testing
    "psutil>=5.9.0,<8.0.0", # System monitoring for benchmarks
]

[tool.swag-mcp.dependency-policy]
direct_dependencies = "Pin every direct runtime and dev dependency to a reviewed lower bound plus an upper bound. Prefer the next major version; use the next calendar-year major for calendar-versioned packages such as regex and aiofiles."
lockfile = "uv.lock is the reproducible source for transitive dependencies and must be regenerated with uv lock after dependency range changes."
automation = "Scheduled dependency automation upgrades one direct dependency per pull request and must pass tests, type checks, linting, and pip-audit before merge."
docker_images = "Published production images should be consumed by immutable tag or digest. Dockerfile base images support digest-pinned build args when the operator has reviewed the current upstream digest."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
cache_dir = ".cache/pytest"
addopts = [
    "--benchmark-storage=.cache/benchmarks",
]
markers = [
    "slow: marks tests as slow (potentially network-dependent)",
    "real_nginx_validation: disables the default nginx validation mock for this test",
]

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py311"
src = ["swag_mcp"]
exclude = [
    ".git",
    ".cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D213", # Multi-line docstring summary should start at the second line
    "D203", # 1 blank line required before class docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]  # No docstrings required in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.11"

[[tool.ty.overrides]]
# Decorator wrappers use func.__name__ which ty can't resolve on Callable types
include = ["swag_mcp/utils/tool_decorators.py", "swag_mcp/utils/mcp_cache.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[tool.coverage.run]
data_file = ".cache/coverage/.coverage"
source = ["swag_mcp"]

[tool.coverage.html]
directory = ".cache/coverage/htmlcov"

[tool.coverage.xml]
output = ".cache/coverage/coverage.xml"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101", "B601"]  # Skip assert_used, paramiko_calls
