## Version 2026/05/10 - MCP Transport logic
# SSE Streaming, Protocol Headers, and CORS.
# Use inside location /mcp or location /session.

# Override proxy.conf buffering for SSE/streaming
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;

# Override proxy.conf Connection for SSE (not websocket upgrade)
proxy_set_header Connection '';

# MCP protocol and session headers
proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
proxy_set_header Mcp-Session-Id $http_mcp_session_id;
proxy_set_header Accept $http_accept;
proxy_set_header Last-Event-ID $http_last_event_id;

# Streaming cache control
add_header Cache-Control "no-cache, no-store, must-revalidate" always;
add_header Pragma "no-cache" always;
add_header Expires "0" always;

# CORS headers
# SECURITY WARNING: Reflecting $http_origin unconditionally with credentials is a risk.
# To restrict allowed origins, set $cors_allowed_origin at the server block level
# (e.g. via a geo/map block) and replace $http_origin below with that variable.
# By default we reflect the request origin to support MCP clients from multiple hosts;
# ensure this config is only reachable through SWAG's authenticated proxy layer.
add_header Access-Control-Allow-Origin $http_origin always;
add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, MCP-Protocol-Version, Mcp-Session-Id, Last-Event-ID" always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Access-Control-Max-Age "3600" always;

# CORS preflight
if ($request_method = 'OPTIONS') {
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, MCP-Protocol-Version, Mcp-Session-Id, Last-Event-ID" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Max-Age "3600" always;
    add_header Content-Type "text/plain charset=UTF-8";
    add_header Content-Length 0;
    return 204;
}
