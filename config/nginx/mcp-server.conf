## Version 2026/05/10 - Axon Standard Server Sidecar
# Identity, Discovery, and Auth endpoints for MCP services.
# Use at server level. Requires $mcp_upstream variables to be set.

# DNS rebinding protection
set $origin_valid 0;
if ($http_origin = "") { set $origin_valid 1; }
if ($http_origin = "https://$server_name") { set $origin_valid 1; }
if ($http_origin ~ "^https://(localhost|127\.0\.0\.1)(:[0-9]+)?$") { set $origin_valid 1; }
if ($http_origin ~ "^https://(.*\.)?anthropic\.com$") { set $origin_valid 1; }
if ($http_origin ~ "^https://(.*\.)?claude\.ai$") { set $origin_valid 1; }

add_header X-MCP-Version "2025-06-18" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── OAuth AS endpoints ─────────────────────────────────────────────
location = /.well-known/oauth-authorization-server {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    add_header Cache-Control "public, max-age=300" always;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location = /mcp/.well-known/oauth-protected-resource {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    add_header Cache-Control "public, max-age=300" always;
    rewrite ^/mcp(/.+)$ $1 break;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location = /.well-known/oauth-protected-resource {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    add_header Cache-Control "public, max-age=300" always;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location = /.well-known/openid-configuration {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    add_header Cache-Control "public, max-age=300" always;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location = /jwks {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    add_header Cache-Control "public, max-age=3600" always;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location = /register {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location = /authorize {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location = /token {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location = /revoke {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    add_header Cache-Control "no-store" always;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location /auth/ {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location = /callback {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location = /auth/google/callback { 
    include /config/nginx/resolver.conf; 
    include /config/nginx/proxy.conf; 
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port; 
}

location = /success {
    include /config/nginx/resolver.conf;
    include /config/nginx/proxy.conf;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}

location = /health {
    include /config/nginx/resolver.conf;
    proxy_set_header Accept "application/json";
    proxy_set_header X-Health-Check "nginx-mcp-proxy";
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    proxy_pass $mcp_upstream_proto://$mcp_upstream_app:$mcp_upstream_port;
}
