networks:
  jakenet:
    name: ${DOCKER_NETWORK:-swag-mcp}
    external: true

services:
  swag-mcp:
    image: ${SWAG_MCP_IMAGE:-ghcr.io/jmagar/swag-mcp:1.1.6}
    pull_policy: ${SWAG_MCP_PULL_POLICY:-missing}

    container_name: swag-mcp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "${SWAG_MCP_DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${SWAG_MCP_DOCKER_LOG_MAX_FILE:-5}"

    volumes:
      - ${SWAG_MCP_LOG_HOST_PATH:-/tmp/swag-mcp/logs}:/app/.swag-mcp/logs
      - type: bind
        source: ${SWAG_MCP_SSH_HOST_PATH:-./.cache/swag-mcp/ssh}
        target: /home/swagmcp/.ssh
        read_only: true
        bind:
          create_host_path: true
      - ${SWAG_MCP_PROXY_CONFS_HOST_PATH:-/mnt/appdata/swag/nginx/proxy-confs}:/proxy-confs
      - ${SWAG_MCP_NGINX_INCLUDES_HOST_PATH:-./config/nginx}:/config/nginx:ro
      - ${SWAG_MCP_FASTMCP_DATA_HOST_PATH:-/mnt/appdata/swag-mcp/data}:/home/swagmcp/.local/share/fastmcp

    ports:
      - "${SWAG_MCP_BIND_ADDRESS:-127.0.0.1}:${SWAG_MCP_PORT:-49152}:8000"

    env_file:
      - path: .env
        required: true

    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SWAG_MCP_LOG_DIRECTORY: /app/.swag-mcp/logs

    networks:
      - jakenet

    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, os, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); assert data.get('status') == 'healthy'; log_dir=os.environ.get('SWAG_MCP_LOG_DIRECTORY'); assert log_dir and os.access(log_dir, os.W_OK); proxy_path=os.environ.get('SWAG_MCP_PROXY_CONFS_PATH'); assert (not proxy_path) or os.path.isdir(proxy_path)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
