networks:
  jakenet:
    name: ${DOCKER_NETWORK:-swag-mcp}
    external: true

services:
  swag-mcp:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: swag-mcp
    restart: unless-stopped

    volumes:
      - ${SWAG_MCP_LOG_HOST_PATH:-/tmp/swag-mcp/logs}:/app/.swag-mcp/logs
      - ~/.ssh:/home/swagmcp/.ssh:ro
      - ${SWAG_MCP_PROXY_CONFS_HOST_PATH:-/mnt/appdata/swag/nginx/proxy-confs}:/proxy-confs
      - ${SWAG_MCP_NGINX_INCLUDES_HOST_PATH:-./config/nginx}:/config/nginx:ro
      - ${SWAG_MCP_FASTMCP_DATA_HOST_PATH:-/mnt/appdata/swag-mcp/data}:/home/swagmcp/.local/share/fastmcp

    ports:
      - "${SWAG_MCP_PORT:-8000}:8000"

    env_file:
      - .env
      - path: ~/.claude-homelab/.env
        required: false

    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SWAG_MCP_LOG_DIRECTORY: /app/.swag-mcp/logs

    networks:
      - jakenet

    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
